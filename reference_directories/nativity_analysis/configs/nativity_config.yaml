# Nativity Analysis Configuration
# =================================

# Data Settings
data:
  input_file: "data/raw/nativity_analyticdata.csv"
  output_dir: "results"
  
  # Time period
  start_date: "2016-01-01"
  end_date: "2024-01-01"
  
  # Aggregation to bimonthly periods (to match main analysis)
  aggregate_to_bimonthly: true

# Model Settings
model:
  # Model type
  outcome_type: "births"
  outcome_distribution: "NB"  # Negative Binomial or Poisson
  
  # Types to run (similar to dobbs_fertility structure)
  # 
  # "types" are generic categories that define different model specifications.
  # Each type specifies which sub_groups to analyze via the sub_groups list.
  # 
  # Usage via command line:
  #   Run all types:        python scripts/run_full_analysis.py
  #   Run specific type:    python scripts/run_full_analysis.py --type total
  #                         python scripts/run_full_analysis.py --type groups
  #   Override rank:        python scripts/run_full_analysis.py --type groups --rank 5
  #
  # To analyze different populations, simply modify the sub_groups list below.
  # The data must have matching births_{group} and pop_{group} columns.
  #
  # Currently available subgroups in this dataset:
  #   - usborn, foreign
  #   - hisp_usborn, hisp_foreign, nh_usborn, nh_foreign
  types:
    total:
      sub_groups: ["total"]
      ranks_to_test: [10]
    groups:
      sub_groups: ["hisp_usborn", "hisp_foreign", "nh_usborn", "nh_foreign"]
      ranks_to_test: [10]
  
  # Negative Binomial dispersion
  nb_disp: 1.0e-4
  sample_disp: false
  
  # Missingness adjustment
  adjust_for_missingness: true
  
  # Model treated periods
  model_treated: true

# MCMC Settings
mcmc:
  num_chains: 4
  num_warmup: 1000
  num_samples: 2500
  thinning: 10
  random_seed: 8675309
