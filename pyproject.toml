[project]
name = "bayesian_panel_nmf"
version = "0.1.0"
description = "Bayesian hierarchical panel models with low-rank factorization for causal inference"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "YLashchev" }]
dependencies = [
  "numpyro>=0.21,<0.22",
  "pydantic>=2.7,<3",
  "pyarrow>=15",
  # jaxlib resolves transitively via jax; do not pin it directly.
  "jax>=0.10.2,<0.11",
  "pandas>=2.2.3",
  "numpy>=2.0",
  "pyyaml>=6",
  "loguru>=0.7",
  # matplotlib/seaborn are hard deps: reporting + PPC figures are core
  # features (reports.py imports plots.py unconditionally).
  "matplotlib>=3.8",
  "seaborn>=0.13.2",
  "rich>=13.0",
  "arviz>=1.2,<1.3",
  "h5netcdf>=1.8.1",
  "h5py>=3.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6.0", "mypy>=1.10"]

[project.scripts]
bpnmf = "bayesian_panel_nmf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_panel_nmf"]

[tool.ruff]
# Project-owned config (previously implicit via pi-lens's bundled fallback,
# applied only when no [tool.ruff] exists — now explicit so `uv run ruff` and
# any tool/agent get identical behavior).
line-length = 88         # Black/Ruff default; matches AGENTS.md's documented commands
target-version = "py312" # floor of requires-python (>=3.12,<3.14)

[tool.ruff.format]
# https://docs.astral.sh/ruff/formatter/ — Black-compatible defaults, made
# explicit rather than left to Ruff's own implicit defaults.
quote-style = "double" # PEP 8/257-preferred; also normalizes the existing
# single/double quote mix across data.py, inference.py, aggregate_units.py
indent-style = "space"            # PEP 8
skip-magic-trailing-comma = false # keep multi-arg NumPyro sample()/config
# dicts expanded one-arg-per-line rather than collapsed — readability for
# the model file's many keyword arguments
line-ending = "auto"
docstring-code-format = true # plots.py has live `>>> f(x)` doctest
# examples in its numpydoc docstrings; keep them auto-formatted so they can't
# silently drift out of the project's own style
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
# Explicit restatement of the rule set previously supplied only implicitly by
# pi-lens's bundled fallback (config/ruff/core.toml) — now the project's own
# source of truth, identical behavior, no longer contingent on an external
# tool's config being present.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (undefined names, unused imports)
  "I",   # isort (import ordering)
  "B",   # flake8-bugbear (likely bugs and design issues)
  "UP",  # pyupgrade (modernize syntax for target Python version)
  "SIM", # flake8-simplify (simplifiable constructs)
  "C4",  # flake8-comprehensions (unnecessary comprehension patterns)
  "PIE", # flake8-pie (misc lints)
]
ignore = [
  "E501",   # line too long — the formatter handles wrapping, not the linter
  "B008",   # function call in default argument — common FastAPI/typer pattern
  "SIM108", # if/else -> ternary — readability is subjective
]

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
# Suppress only reportMissingImports (pyright's openFilesOnly LSP mode can't
# see the uv .venv when analysing a single file, so it occasionally guesses
# wrong on installed packages like matplotlib). Do NOT point pyright at the
# venv or change typeCheckingMode: verified that resolving the real venv makes
# pyright infer numpyro/jax/pandas call sites confidently WRONG (144 new
# errors incl. models/joint.py) rather than skipping them the way mypy's
# ignore_missing_imports does. mypy remains the enforced type-check gate.
reportMissingImports = false
