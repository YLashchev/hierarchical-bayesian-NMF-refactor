[project]
name = "bayesian_panel_nmf"
version = "0.1.0"
description = "Bayesian hierarchical panel models with low-rank factorization for causal inference"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "YLashchev" }]
dependencies = [
  "numpyro>=0.12.0",
  "jax>=0.4.0,<0.5.0",
  "jaxlib>=0.4.0,<0.5.0",
  "pandas>=1.3.0",
  "numpy>=1.20.0",
  "pyyaml>=5.4",
  "loguru>=0.6.0",
  "seaborn>=0.13.2",
  "rich>=13.0",
  "arviz>=1.1.0",
  "h5netcdf>=1.8.1",
  "h5py>=3.16.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.4.0", "seaborn>=0.11.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6.0", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["src/bayesian_panel_nmf"]

[tool.mypy]
ignore_missing_imports = true
