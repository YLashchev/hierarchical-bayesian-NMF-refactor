data:
  input_file: "data/raw/nativity_analyticdata.csv"
  output_dir: "results/production_test"
  
  schema:
    unit_col: "state"
    time_col: "time"
    treatment_col: "exposed"
    outcomes:
      - outcome_col: "births_usborn"
        denominator_col: "pop_usborn"
        label: "usborn"
      - outcome_col: "births_foreign"
        denominator_col: "pop_foreign"
        label: "foreign"
  
  date_format: "%m/%d/%y"
  start_date: "2016-01-01"
  end_date: "2024-01-01"
  
  aggregation:
    enabled: true
    period: "bimonthly"

model:
  outcome_distribution: "NB"
  types:
    nativity:
      groups: ["usborn", "foreign"]
      ranks_to_test: [10]
  nb_disp: 1.0e-4
  sample_disp: false
  adjust_for_missingness: true
  model_treated: true

mcmc:
  num_chains: 4
  num_warmup: 1000
  num_samples: 2500
  thinning: 10
  random_seed: 8675309
  progress_bar: true
