# =============================================================================
# Education group — CUT model (two-stage pure cut posterior)
# =============================================================================
# Same data/schema as education_joint.yaml but inference_mode: "cut". Stage 1
# fits untreated cells only; selected Stage-1 draws each condition a full
# Stage-2 fit. Separate output_dir so it coexists with the joint run.

data:
  input_file: "data/raw/fertility_data.csv"
  output_dir: "results_education_cut"

  schema:
    unit_col: "state"
    time_col: "time"
    treatment_col: "exposed_births"
    outcomes_from_prefixes:
      outcome_prefix: "births_"
      denominator_prefix: "pop_"
      include:
        - nohs
        - hs
        - somecoll
        - coll

  date_format: "%Y-%m-%d"
  start_date: "2016-01-01"
  end_date: "2024-01-01"

  aggregation:
    enabled: true
    period: "bimonthly"

model:
  outcome_distribution: "NB"
  types:
    education:
      groups: ["nohs", "hs", "somecoll", "coll"]
      ranks_to_test: [5]
  nb_disp: 1.0e-4
  sample_disp: false
  adjust_for_missingness: true
  model_treated: true
  inference_mode: "cut"

mcmc:
  auto_parallelism: true
  max_chains: 4
  num_warmup: 1000
  num_samples: 2500
  thinning: 10
  random_seed: 8675309
  progress_bar: true
  # Gate R-hat/ESS on the identified quantities only; excludes the
  # non-identifiable sites (state_fe, time_fe, time_fac, unit_weight).
  # Applies to Stage-1 and every Stage-2 component gate alike.
  gate_params:
    - "mu"              # mu, mu_ctrl
    - "te"
    - "treatment"       # treatment_{it,state,category}_scale, treatment_kt
    - "state_treatment" # state_treatment_effect
    - "category_treatment" # category_treatment_effect
    - "state_category"  # state_category_te, state_category_scale

output:
  figures: true
  clean: true

cut:
  num_stage1_draws: 50
  stage2_draws_per_component: 250
  stage2_mcmc:
    num_warmup: 500
    num_samples: 1000
    thinning: 1
