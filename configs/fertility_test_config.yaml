# =============================================================================
# Fertility Analysis - Test Configuration
# =============================================================================
#
# Quick test config for the Dobbs fertility data.
# Maps columns from the original dobbs_fertility analysis.
#
# Groups available:
#   race: nhwhite, hisp, nhblack, otherraceeth
#   edu: nohs, hs, somecoll, coll
#   age: age1524, age2534, age3544
#   insurance: medicaid, nonmedicaid
#   marital: married, unmarried
#   total: total
#
# Usage:
#   python scripts/run_analysis.py --config configs/fertility_test_config.yaml
#
# =============================================================================

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  input_file: "data/raw/fertility_data.csv"
  output_dir: "results/fertility_test"

  schema:
    unit_col: "state"
    time_col: "time"
    treatment_col: "exposed_births"

    outcomes:
      # Race/ethnicity groups
      - outcome_col: "births_nhwhite"
        denominator_col: "pop_nhwhite"
        label: "nhwhite"
      - outcome_col: "births_hisp"
        denominator_col: "pop_hisp"
        label: "hisp"
      - outcome_col: "births_nhblack"
        denominator_col: "pop_nhblack"
        label: "nhblack"
      - outcome_col: "births_otherraceeth"
        denominator_col: "pop_otherraceeth"
        label: "otherraceeth"
      # Education groups
      - outcome_col: "births_nohs"
        denominator_col: "pop_nohs"
        label: "nohs"
      - outcome_col: "births_hs"
        denominator_col: "pop_hs"
        label: "hs"
      - outcome_col: "births_somecoll"
        denominator_col: "pop_somecoll"
        label: "somecoll"
      - outcome_col: "births_coll"
        denominator_col: "pop_coll"
        label: "coll"
      # Age groups
      - outcome_col: "births_age1524"
        denominator_col: "pop_age1524"
        label: "age1524"
      - outcome_col: "births_age2534"
        denominator_col: "pop_age2534"
        label: "age2534"
      - outcome_col: "births_age3544"
        denominator_col: "pop_age3544"
        label: "age3544"
      # Insurance groups
      - outcome_col: "births_medicaid"
        denominator_col: "pop_medicaid"
        label: "medicaid"
      - outcome_col: "births_nonmedicaid"
        denominator_col: "pop_nonmedicaid"
        label: "nonmedicaid"
      # Marital status groups
      - outcome_col: "births_married"
        denominator_col: "pop_married"
        label: "married"
      - outcome_col: "births_unmarried"
        denominator_col: "pop_unmarried"
        label: "unmarried"
      # Total
      - outcome_col: "births_total"
        denominator_col: "pop_total"
        label: "total"

  # Time column is already in %Y-%m-%d format
  date_format: "auto"

  # Time period (same as original analysis)
  start_date: "2016-01-01"
  end_date: "2024-01-01"

  # Data is already bimonthly (bmcode), no aggregation needed
  aggregation:
    enabled: false

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model:
  outcome_distribution: "NB"

  types:
    total:
      groups: ["total"]
      ranks_to_test: [5]
    race:
      groups: ["nhwhite", "hisp", "nhblack", "otherraceeth"]
      ranks_to_test: [5]
    edu:
      groups: ["nohs", "hs", "somecoll", "coll"]
      ranks_to_test: [5]
    age:
      groups: ["age1524", "age2534", "age3544"]
      ranks_to_test: [5]
    insurance:
      groups: ["medicaid", "nonmedicaid"]
      ranks_to_test: [5]
    marital:
      groups: ["married", "unmarried"]
      ranks_to_test: [5]
      # California should be dropped for marital (per original dobbs_fertility code)
      exclude_units: ["California"]

  nb_disp: 1.0e-4
  sample_disp: false
  adjust_for_missingness: true
  model_treated: true

# -----------------------------------------------------------------------------
# MCMC Settings (fast test: 2 chains, short runs)
# -----------------------------------------------------------------------------
mcmc:
  num_chains: 2
  num_warmup: 100
  num_samples: 100
  thinning: 1
  random_seed: 42
  progress_bar: true
