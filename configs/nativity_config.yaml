# =============================================================================
# Nativity Analysis Configuration (Backwards Compatible)
# =============================================================================
# 
# This configuration file maintains backwards compatibility with the original
# nativity_analysis package for analyzing Dobbs fertility impacts by nativity.
#
# =============================================================================

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  # Path relative to bayesian_panel_nmf directory
  # Run from bayesian_panel_nmf: python scripts/run_analysis.py --config configs/nativity_config.yaml
  input_file: "data/raw/nativity_analyticdata.csv"
  output_dir: "results"
  
  # Schema for nativity data
  schema:
    unit_col: "state"
    time_col: "time"
    treatment_col: "exposed"
    
    # Nativity-specific outcomes
    # Note: Column names match the actual data file (no underscore between prefix and group)
    outcomes:
      # Hispanic nativity groups
      - outcome_col: "birthshisp_usborn"
        denominator_col: "pophisp_usborn"
        label: "hisp_usborn"
      - outcome_col: "birthshisp_foreign"
        denominator_col: "pophisp_foreign"
        label: "hisp_foreign"
      # Non-Hispanic nativity groups
      - outcome_col: "birthsnh_usborn"
        denominator_col: "popnh_usborn"
        label: "nh_usborn"
      - outcome_col: "birthsnh_foreign"
        denominator_col: "popnh_foreign"
        label: "nh_foreign"
      # Total (US-born + Foreign-born)
      - outcome_col: "births_usborn"
        denominator_col: "pop_usborn"
        label: "usborn"
      - outcome_col: "births_foreign"
        denominator_col: "pop_foreign"
        label: "foreign"
    
  # Date format for the nativity data (M/D/YY)
  date_format: "%m/%d/%y"
  
  # Time period
  start_date: "2016-01-01"
  end_date: "2024-01-01"
  
  # Aggregation to bimonthly periods (matches main analysis)
  aggregation:
    enabled: true
    period: "bimonthly"

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model:
  outcome_distribution: "NB"
  
  # Model types matching original nativity_analysis
  types:
    total:
      # Aggregate US-born + Foreign-born (disjoint subpopulations)
      groups: ["total"]
      total_from: ["usborn", "foreign"]
      ranks_to_test: [10]
    groups:
      # Stratified by Hispanic/Non-Hispanic and nativity
      groups: ["hisp_usborn", "hisp_foreign", "nh_usborn", "nh_foreign"]
      ranks_to_test: [10]
    nativity:
      # Stratified by US-born vs Foreign-born only
      groups: ["usborn", "foreign"]
      ranks_to_test: [10]
  
  # Negative Binomial dispersion
  nb_disp: 1.0e-4
  sample_disp: false
  
  # Missingness adjustment (important for suppressed low counts)
  adjust_for_missingness: true
  
  # Model treatment effects
  model_treated: true

# -----------------------------------------------------------------------------
# MCMC Settings
# -----------------------------------------------------------------------------
mcmc:
  num_chains: 4
  num_warmup: 1000
  num_samples: 2500
  thinning: 10
  random_seed: 8675309
  progress_bar: true

# -----------------------------------------------------------------------------
# Parallelization
# -----------------------------------------------------------------------------
parallel:
  # Set to 1 for sequential execution, or -1 to use the maximum safe count.
  analysis_workers: 1

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------
output:
  figures: false
  clean: false
  filename_pattern: "{distribution}_{outcome}_{type}_{rank}"
