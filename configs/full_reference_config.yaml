# =============================================================================
# Bayesian Panel NMF — Full Reference Configuration
# =============================================================================
# Every legal config key shown with inline documentation.
# Copy this file, uncomment what you need, and delete what you don't.
#
# Usage:
#   uv run scripts/run_analysis.py --config configs/my_config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Data Settings
# -----------------------------------------------------------------------------
data:
  # --- Required ---
  input_file: "data/panel_data.csv" # Path to input CSV (relative to cwd)
  output_dir: "results" # Directory for all outputs

  # --- Schema (required) ---
  # Maps your CSV columns to the pipeline's internal names.
  schema:
    unit_col: "state" # Panel unit identifier (state, firm, county, etc.)
    time_col: "time" # Time column; parsed as datetime
    treatment_col: "exposed" # 0 = control, 1 = treated

    # Define outcomes EXPLICITLY (choose ONE style: outcomes OR outcomes_from_prefixes)
    outcomes:
      - outcome_col: "births_total"
        label: "total"
        denominator_col: "pop_total" # Optional: null if not rate-normalized
      - outcome_col: "births_teen"
        label: "teen"
        denominator_col: "pop_teen"

    # OR use the PREFIX shortcut for many similarly-named columns:
    # outcomes_from_prefixes:
    #   outcome_prefix: "births_"       # Column prefix for outcomes
    #   denominator_prefix: "pop_"      # Prefix for denominators (optional)
    #   include:                        # Suffixes to include; omit = auto-detect all
    #     - total
    #     - teen
    #     - age2534

  # --- Optional filtering / parsing ---
  date_format: "auto" # "auto" or strftime string, e.g. "%Y-%m-%d"
  start_date: null # Inclusive lower bound (YYYY-MM-DD)
  end_date: null # Inclusive upper bound

  # --- Temporal aggregation ---
  aggregation:
    enabled: false # Group time periods before modeling
    period: "bimonthly" # "monthly" | "bimonthly" | "quarterly" | "yearly"

  # --- Missing data handling ---
  # False (default) = error on structurally absent (unit, group, time) cells.
  # True = treat absent cells as suppressed (enters missingness adjustment).
  allow_unbalanced_panel: false

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model:
  outcome_distribution: "NB" # "NB" (Negative Binomial) or "Poisson"

  # Each type = one independent model run with its own groups and ranks.
  types:
    total:
      groups: ["total"] # Labels must match schema outcome labels
      ranks_to_test: [5, 10, 15] # Factorization ranks to fit and compare

      # Synthetic "total" helper (use ONE if "total" is not explicit in schema):
      # total_from: ["usborn", "foreign"]   # Sum specific subgroups
      # total_all: true                      # Sum ALL outcomes (assert disjoint)

      exclude_units: null # Drop units for THIS type only, e.g. ["Texas"]

    stratified:
      groups: ["teen", "age2534", "age3544"]
      ranks_to_test: [10]

  # --- NB dispersion ---
  nb_disp: 1.0e-4 # Fixed dispersion when sample_disp: false
  sample_disp: false # True = sample dispersion as a parameter

  # --- Missingness likelihood adjustment ---
  # Set true if your data has censored/suppressed low counts (common in vital stats).
  adjust_for_missingness: false

  # --- Treatment effect modeling ---
  # False = control-only model (useful for pure counterfactual estimation).
  model_treated: true

# -----------------------------------------------------------------------------
# MCMC Settings
# -----------------------------------------------------------------------------
mcmc:
  num_chains: 4 # Parallel chains
  num_warmup: 1000 # Burn-in per chain
  num_samples: 2500 # Posterior draws per chain
  thinning: 10 # Keep every Nth sample (reduces output size)
  random_seed: 8675309 # Reproducibility seed
  progress_bar: true # Show tqdm progress bar during sampling

# -----------------------------------------------------------------------------
# Parallelization Settings
# -----------------------------------------------------------------------------
parallel:
  # Workers for running multiple model.types concurrently.
  # 1 = sequential. -1 = auto-cap at cpu_count // mcmc.num_chains.
  analysis_workers: 1

  # Deprecated alias; use analysis_workers instead.
  # num_workers: 1

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------
output:
  # --- File generation ---
  figures: false # Auto-generate fit/gap/interval/ppc plots
  clean: false # Delete <output_dir>/<type>/ before writing
  save_traces: false # Save full posterior draws as NetCDF sidecar (arviz InferenceData)
  filename_pattern: "{distribution}_{type}_{rank}"

  # --- Reporting ---
  target_unit:
    null # Unit for headline table & per-unit plots.
    # Null = auto-detect (unit with most post-treatment obs)
  report_groups: null # Subset for per-unit figures; null = all groups
  print_tables: true # Print rich terminal tables
  print_target_table: true # Print the target-unit headline table (Table 1)

  # --- Progress heartbeat (parallel runs only) ---

  # --- Synthetic aggregate units (reporting/PPC only; NOT fed to model) ---
  # aggregate_units:
  #   - unit: "Treated units excluding Texas"
  #     include_treated_units: true
  #     exclude_units: ["Texas"]
  #     strict: false                  # Error if exclude_units missing?
  #     overwrite: false               # Overwrite existing unit with same name?
  #   - unit: "All treated"
  #     include_all_units: true

  # --- PPC plot filtering ---
  # ppc_units:                         # Include only these units in PPC
  #   - "Texas"
  # ppc_exclude_units:                 # Exclude these units from PPC
  #   - "California"
  # ppc_acf_lags: [6, 3, 1]           # ACF lags for temporal PPC checks
  # ppc_unit_corr_max_time: "2022-04-01"  # Max date for unit-correlation PPC plot
